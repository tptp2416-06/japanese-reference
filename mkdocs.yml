site_name: 日本語 Reference
site_description: Personal Japanese language reference — Tokyo casual, N3 level
site_author: Tim
docs_dir: docs
site_dir: site

# LOAD-BEARING — do not change this to false.
#
# Every Anki card in the jp-deck project links to
#   https://nihongo.jp-node.com/deck/grammar/<page-slug>/#<anchor>
# and that URL shape exists only because this is true. Setting it false
# republishes every page as <path>.html and breaks every link on every card
# at once — silently. The build succeeds, the site looks correct, and only a
# tapped link from a flashcard reveals it.
#
# The link builder lives in the jp-deck repo (scripts/vocab.py, #194); the
# constraint was first recorded as its DECISIONS.md #68 and survives it.
use_directory_urls: true

# The generated deck pages ARE in the nav as of jp-deck `#228` (R49): the
# sidebar groups them by grammatical Function, and `navigation.prune` below
# means only the current branch is rendered into any given page, so 362
# entries cost nothing per page. The nav block itself is GENERATED — see the
# markers under `- Deck:` at the foot of this file.
#
# The contrast pages stay out. They are a comparison layer reached from the
# index and from each grammar section's *Compare:* line, not a place to
# browse to, and listing them would put the same page in the sidebar twice
# under two different names.
not_in_nav: |
  deck/contrasts/*.md

theme:
  name: material
  language: ja
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  # Tim's artwork. The LIGHT one is the static favicon so a reader with
  # JavaScript off still gets an icon; deck.js swaps in the dark artwork when
  # the page is in dark mode and follows the palette toggle.
  #
  # 64px, DERIVED from the committed 512px masters by jp-deck
  # scripts/make_icons.py — 8.7 KB against the master's 423 KB, and identical
  # at the size a tab renders. Regenerate with that script if the artwork
  # changes; do NOT point this at the master.
  #
  # The iOS home-screen icon is docs/apple-touch-icon.png, found by
  # convention at the site root — no <link>, no template override.
  #
  # All of these live under docs/ — NOT under site/, which mkdocs wipes on
  # every build.
  favicon: assets/images/favicon-light.png

  font:
    text: Nunito
    code: JetBrains Mono

  features:
    - navigation.tabs           # Top-level tabs (Grammar / Patterns / Dialogues)
    - navigation.tabs.sticky    # Tabs stay visible when scrolling
    - navigation.prune          # Render ONLY the current branch of the nav
    - navigation.path           # Breadcrumb: DECK ▸ function group
    - navigation.top            # Back-to-top button
    - navigation.indexes        # Section index pages
    - search.highlight          # Highlight search terms on page
    - search.suggest            # Search autocomplete
    - search.share              # Shareable search links
    - content.tooltips          # Hover tooltips
    - toc.follow                # TOC highlights as you scroll

extra_css:
  - assets/css/custom.css
  - assets/css/japanese-reference.css
  # LAST, and that is load-bearing: identity.css supersedes the two above
  # wherever they carry identity rather than meaning (jp-deck `#228`).
  - assets/css/identity.css

extra_javascript:
  - assets/js/custom.js
  # GENERATED by jp-deck scripts/build_site.py — the page/level/shuffle index.
  # It must load BEFORE deck.js, which reads it.
  - assets/js/deck-index.js
  - assets/js/deck.js

plugins:
  - search:
      lang:
        - en
        - ja
  - tags
  - glightbox
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
  - minify:
      minify_html: true
  - awesome-pages

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tilde
  - tables
  - toc:
      permalink: true
      toc_depth: 3
      title: On this page

